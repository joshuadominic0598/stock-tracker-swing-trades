name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 binaries are unavailable on Ubuntu 26.04.
          - { os: ubuntu-22.04, python: '3.9' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: macos-latest, python: '3.12' }
          - { os: windows-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python tools/format_python.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_shareable.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - run: npm --prefix tools/web ci
      - run: npm --prefix tools/web run check
      - run: npm --prefix tools/web exec -- playwright install --with-deps chromium
      - run: npm --prefix tools/web run test:ui
