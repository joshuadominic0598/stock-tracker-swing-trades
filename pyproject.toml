[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-signal"
version = "2.1.0"
description = "Local swing-trade research with technical flags and ranked candidates"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["tzdata==2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["ruff==0.14.4"]

[project.scripts]
swing-signal = "swing_signal.cli:main"

[project.urls]
Repository = "https://github.com/joshuadominic0598/stock-tracker-swing-trades"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
swing_signal = ["web/*", "web/vendor/*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["src/swing_signal/web/vendor", "node_modules", ".tmp", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
