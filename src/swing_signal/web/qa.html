<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Swing Signal · viewport QA</title>
    <style>
      body {
        margin: 0;
        background: #000000;
      }
      iframe {
        border: 0;
        transform-origin: top left;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe title="Swing Signal responsive preview"></iframe>
    <script>
      const q = new URLSearchParams(location.search),
        w = Number(q.get('width')) || 1440,
        h = Number(q.get('height')) || 1000,
        f = document.querySelector('iframe');
      f.width = w;
      f.height = h;
      f.src = '/#' + (q.get('view') || 'overview');
      function fit() {
        f.style.transform = 'scale(' + Math.min(1, innerWidth / w) + ')';
        document.body.style.height = Math.round(h * Math.min(1, innerWidth / w)) + 'px';
      }
      addEventListener('resize', fit);
      fit();
    </script>
  </body>
</html>
